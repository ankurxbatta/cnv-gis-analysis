    out_dir: cnv
    filename: cnv_population_by_parcel_2021.geojson
    format: GeoJSON
    geographic_level: parcel
    coverage: "City of North Vancouver"
    expected_count: 7185
    derived_estimate: true
    notes: >
      CNV-modelled parcel-level population disaggregated from census blocks
      (SUM_NumUnits_byCensusBlk). NOT a Statistics Canada product. Treat as a
      municipal estimate and never as a census count.

