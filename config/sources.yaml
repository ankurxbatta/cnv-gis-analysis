  # ---------------------------------------------------------------------------
  - source_id: icbc_crashes_north_vancouver
    organization: "Insurance Corporation of British Columbia (ICBC)"
    dataset: "Lower Mainland Crashes - filtered to NORTH VANCOUVER"
    handler: http_file
    url: "https://public.tableau.com/app/profile/icbc/viz/LowerMainlandCrashes/LMDashboard"
    download_url: "https://public.tableau.com/views/LowerMainlandCrashes/LMDashboard.csv?:showVizHome=no&Municipality=NORTH%20VANCOUVER"
    out_dir: safety
    filename: icbc_crashes_north_vancouver.csv
    format: CSV
    geographic_level: intersection_or_block_name
    coverage: "North Vancouver (City AND District combined - see notes)"
    license: "Open Data Licence for ICBC Information"
    notes: >
      Retrieved through Tableau Public's built-in CSV export for a publicly published
      dashboard (the sanctioned download path; no access control is bypassed). Two
      material limitations: (1) ICBC's 'NORTH VANCOUVER' municipality value covers BOTH
      the City and the District, so records must be disambiguated by matching location
      strings to CNV street pairs; (2) records are location NAME strings with no
      coordinates, so geocoding to the CNV intersection layer is name-based and
      approximate. Crash counts are aggregate; no individual or personal data.

