# =============================================================================
# config/sources.yaml
# Source inventory for the City of North Vancouver GIS analysis pipeline.
#
# Audited: 2026-08-11. Every entry below was probed live before being recorded.
# Handler types consumed by scripts/01_download.py:
#   http_file     - direct file download (zip/csv/pdf), streamed to data/raw/
#   arcgis_layer  - ArcGIS REST MapServer/FeatureServer layer, paginated to GeoJSON
#   wfs           - OGC WFS GetFeature, saved as GeoJSON
#   html_page     - HTML saved verbatim for later structured extraction
# =============================================================================

defaults:
  arcgis_out_sr: 26910        # NAD83 / UTM zone 10N - native CRS of the CNV server
  arcgis_page_size: 1000      # server maxRecordCount is 2000; stay under it
  retries: 4
  backoff_seconds: 3
  timeout_seconds: 180

servers:
  cnv_arcgis: "https://gisext2.cnv.org/arcgis/rest/services"
  bc_wfs: "https://openmaps.gov.bc.ca/geo/pub/wfs"
  statcan_geo: "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers"
  statcan_profile: "https://www12.statcan.gc.ca/census-recensement/2021/dp-pd/prof/details/download-telecharger/comp/GetFile.cfm"

sources:

  # ---------------------------------------------------------------------------
  # BOUNDARY
  # ---------------------------------------------------------------------------
  - source_id: bc_cnv_boundary
    organization: "Province of BC - GeoBC / BC Data Catalogue"
    dataset: "Municipalities - Legally Defined Administrative Areas of BC (ABMS)"
    handler: wfs
    url: "https://catalogue.data.gov.bc.ca/dataset/municipalities-legally-defined-administrative-areas-of-bc"
    typename: "WHSE_LEGAL_ADMIN_BOUNDARIES.ABMS_MUNICIPALITIES_SP"
    cql_filter: "ADMIN_AREA_NAME='City of North Vancouver'"
    out_dir: bcdata
    filename: cnv_municipal_boundary_abms.geojson
    format: GeoJSON
    geographic_level: municipality
    coverage: "City of North Vancouver"
    license: "Open Government Licence - British Columbia"
    authoritative: true
    notes: >
      Authoritative legal municipal boundary. LGL_ADMIN_AREA_ID=114. The District of
      North Vancouver is a separate feature (ID=125) and is deliberately excluded.

  - source_id: bc_northshore_municipalities
    organization: "Province of BC - GeoBC"
    dataset: "ABMS Municipalities - North Shore context"
    handler: wfs
    url: "https://catalogue.data.gov.bc.ca/dataset/municipalities-legally-defined-administrative-areas-of-bc"
    typename: "WHSE_LEGAL_ADMIN_BOUNDARIES.ABMS_MUNICIPALITIES_SP"
    cql_filter: "ADMIN_AREA_NAME LIKE '%North Vancouver%' OR ADMIN_AREA_NAME LIKE '%West Vancouver%'"
    out_dir: bcdata
    filename: northshore_municipalities_abms.geojson
    format: GeoJSON
    geographic_level: municipality
    coverage: "North Shore municipalities"
    license: "Open Government Licence - British Columbia"
    notes: "Context layer only, used to verify CNV/DNV separation. Never used as the study area."

  # ---------------------------------------------------------------------------
  # STATISTICS CANADA - census geography
  # ---------------------------------------------------------------------------
  - source_id: statcan_da_boundaries_2021
    organization: "Statistics Canada"
    dataset: "2021 Census - Dissemination Areas cartographic boundary file (92-169-X)"
    handler: http_file
    url: "https://www150.statcan.gc.ca/n1/en/catalogue/92-169-X2021001"
    download_url: "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lda_000b21a_e.zip"
    out_dir: statcan
    filename: lda_000b21a_e.zip
    format: "Shapefile (zip)"
    geographic_level: dissemination_area
    coverage: Canada
    version: "2021 Census, cartographic boundary"
    license: "Statistics Canada Open Licence"
    expect_magic: zip
    notes: "Primary DA geometry. Join key DAUID. Native CRS EPSG:3347 (Lambert)."

  - source_id: statcan_db_boundaries_2021
    organization: "Statistics Canada"
    dataset: "2021 Census - Dissemination Blocks cartographic boundary file (92-163-X)"
    handler: http_file
    url: "https://www150.statcan.gc.ca/n1/en/catalogue/92-163-X2021001"
    download_url: "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/ldb_000b21a_e.zip"
    out_dir: statcan
    filename: ldb_000b21a_e.zip
    format: "Shapefile (zip)"
    geographic_level: dissemination_block
    coverage: Canada
    license: "Statistics Canada Open Licence"
    expect_magic: zip
    notes: "Finer geography for population/dwelling counts only (DB profiles are suppressed for most variables)."

  - source_id: statcan_csd_boundaries_2021
    organization: "Statistics Canada"
    dataset: "2021 Census - Census Subdivisions cartographic boundary file"
    handler: http_file
    url: "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/index2021-eng.cfm"
    download_url: "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lcsd000b21a_e.zip"
    out_dir: statcan
    filename: lcsd000b21a_e.zip
    format: "Shapefile (zip)"
    geographic_level: census_subdivision
    coverage: Canada
    license: "Statistics Canada Open Licence"
    expect_magic: zip
    notes: "Used to confirm the CNV CSD (CSDUID 5915051) and validate DA membership."

  # ---------------------------------------------------------------------------
  # STATISTICS CANADA - census profile (PRIMARY demographic source)
  # ---------------------------------------------------------------------------
  - source_id: statcan_census_profile_bc_da
    organization: "Statistics Canada"
    dataset: "Census Profile, 2021 - British Columbia, dissemination areas (98-401-X2021006)"
    handler: http_file
    url: "https://www12.statcan.gc.ca/census-recensement/2021/dp-pd/prof/details/download-telecharger.cfm"
    download_url: "https://www12.statcan.gc.ca/census-recensement/2021/dp-pd/prof/details/download-telecharger/comp/GetFile.cfm?Lang=E&FILETYPE=CSV&GEONO=006_BC_CB"
    out_dir: statcan
    filename: 98-401-X2021006_BC_CB_eng_CSV.zip
    format: "CSV (zip)"
    geographic_level: dissemination_area
    coverage: "British Columbia"
    version: "98-401-X2021006, released 2022-12-15"
    license: "Statistics Canada Open Licence"
    expect_magic: zip
    approx_size_mb: 293
    primary_source: true
    notes: >
      PRIMARY source for population, age and dwelling variables. This is the
      British-Columbia-only comprehensive Census Profile at DA level, preferred over
      the 2.2 GB national file. Confirmed via Content-Disposition header.

  - source_id: statcan_census_profile_bc_csd
    organization: "Statistics Canada"
    dataset: "Census Profile, 2021 - British Columbia, census subdivisions (98-401-X2021006)"
    handler: http_file
    url: "https://www12.statcan.gc.ca/census-recensement/2021/dp-pd/prof/details/download-telecharger.cfm"
    download_url: "https://www12.statcan.gc.ca/census-recensement/2021/dp-pd/prof/details/download-telecharger/comp/GetFile.cfm?Lang=E&FILETYPE=CSV&GEONO=025"
    out_dir: statcan
    filename: 98-401-X2021006_BC_CSD_eng_CSV.zip
    format: "CSV (zip)"
    geographic_level: census_subdivision
    coverage: "British Columbia"
    license: "Statistics Canada Open Licence"
    expect_magic: zip
    notes: "CSD-level totals used to validate that DA sums reconcile to the CNV municipal total."

