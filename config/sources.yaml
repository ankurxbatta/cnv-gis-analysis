    url: "https://gisext2.cnv.org/arcgis/rest/services/BaseMapServices/TransportMAP/MapServer/73"
    out_dir: cnv
    filename: cnv_affordable_housing.geojson
    format: GeoJSON
    geographic_level: building
    coverage: "City of North Vancouver"
    expected_count: 59
    notes: >
      Type, Tenure_Type, Eligibility, Operator_Developer, Total_Units, Status.
      The Eligibility/Type fields are the authoritative municipal basis for identifying
      seniors housing - preferred over OpenStreetMap inference.

  - source_id: cnv_population_by_parcel_2021
