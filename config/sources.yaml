    out_dir: cnv
    filename: cnv_neighbourhoods.geojson
    format: GeoJSON
    geographic_level: neighbourhood
    coverage: "City of North Vancouver"
    license: "City of North Vancouver open data terms - verify"
    expected_count: 10
    notes: "Vector replacement for the CNV_Neighbourhoods PDF map. 10 neighbourhoods."

